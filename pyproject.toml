[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-speech"
version = "0.0.1"
description = "ADA: lightweight, CPU-friendly encoder-decoder Transformer models for speech-to-text, text-to-speech and text-to-text."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# The base install is what END USERS get: CPU inference only, kept small on purpose.
dependencies = [
    "faster-whisper>=1.1",
    # av 19 removed an argument faster-whisper 1.2.1 still passes (audio decoding fails).
    "av>=11,<19",
]

[project.optional-dependencies]
# Training on your GPU. Install torch separately first (see docs/SETUP_WINDOWS.md),
# because the RTX 50-series needs a CUDA 12.8 build of PyTorch.
train = [
    "transformers>=4.46",
    # 3.x decodes audio with soundfile; 4.x needs torchcodec, which is harder on Windows.
    "datasets>=3.0,<4.0",
    "accelerate>=1.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "jiwer>=3.0",
    "pyyaml>=6.0",
    "tensorboard>=2.15",
]
# Converting a trained model into the fast int8 CPU format.
export = [
    "ctranslate2>=4.4",
    "transformers>=4.46",
]
dev = [
    "pytest>=8.0",
    "soundfile>=0.12",
    "numpy>=1.24",
    "ruff>=0.5",
    "pyyaml>=6.0",
    "jiwer>=3.0",
]

[project.scripts]
ada-stt = "ada.stt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
