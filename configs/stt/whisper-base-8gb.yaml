# ADA-STT v0.1 config: whisper-base on an 8 GB laptop GPU (e.g. RTX 5050).
# Copy this file and change `language` and `data_dir` for your dataset.

base_model: openai/whisper-base      # 74M params: the CPU-first v0.1 target (see docs/DATA_TAMIL.md)
language: tamil                      # Whisper language name, e.g. english, hindi, tamil
task: transcribe
data_dir: data/stt/cv-ta             # output of scripts/stt/prepare_data.py
output_dir: models/ada-stt-base

# Validation during training uses the dev split (if prepare_data.py wrote one), else test,
# limited to this many clips (fixed random sample) so each eval takes minutes, not an hour.
eval_max_samples: 1000

# Memory: effective batch = 16 x 1 = 16. If you hit "CUDA out of memory",
# halve per_device_train_batch_size and double gradient_accumulation_steps.
per_device_train_batch_size: 16
per_device_eval_batch_size: 16
gradient_accumulation_steps: 1
gradient_checkpointing: true
bf16: true                           # RTX 50-series supports bf16; set false + fp16 true on older GPUs
fp16: false

learning_rate: 2.5e-5                 # base tolerates a higher rate than small
warmup_steps: 500
max_steps: 5000
eval_steps: 500
save_steps: 500
save_total_limit: 2
logging_steps: 25
generation_max_length: 225
max_audio_seconds: 30                # Whisper's input window; longer clips are dropped
dataloader_num_workers: 0            # 0 is safest on Windows
seed: 42
